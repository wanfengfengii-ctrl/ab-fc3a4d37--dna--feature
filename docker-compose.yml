services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ancient-dna-phasing:latest
    container_name: phasing-api
    ports:
      # Host port is configurable via API_PORT (defaults to 8000).
      - "${API_PORT:-8000}:8000"
    environment:
      - UVICORN_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); assert r.status==200"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  verify:
    image: ancient-dna-phasing:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phasing-verify
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_BASE_URL=http://api:8000
    entrypoint: ["python", "scripts/verify.py"]
    restart: "no"
